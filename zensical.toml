[project]
site_name = "SiteStack"
site_description = "Your personal developer resource hub. Organize, discover and manage your favourite websites, tools, repositories and learning resources."
site_author = "A R Danish"
site_url = "https://helloardanish.github.io/sitestack/"
copyright = "Copyright &copy; 2026 A R Danish"

docs_dir = "docs"
site_dir = "site"

nav = [
    { "Dashboard" = "index.md" }
]

extra_css = [
    "assets/css/main.css"
]

extra_javascript = [
    { path = "assets/js/app.js", type = "module" }
]

[project.theme]
variant = "modern"
features = [
    "content.code.copy"
]

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "amber"
